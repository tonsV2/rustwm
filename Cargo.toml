[package]
name = "rustwm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# The same calloop Smithay uses, with signal handling turned on.
calloop = { version = "0.14", features = ["signals"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fontdue = "0.9.4"
inotify = { version = "0.11", default-features = false }
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_drm", "backend_gbm", "backend_libinput", "backend_udev", "backend_session_libseat", "wayland_frontend", "desktop", "renderer_gl"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xcursor = "0.3"
