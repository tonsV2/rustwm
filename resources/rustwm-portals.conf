# Portal backends for XDG_CURRENT_DESKTOP=rustwm. Install as
# /usr/share/xdg-desktop-portal/rustwm-portals.conf, or for one user as
# ~/.config/xdg-desktop-portal/rustwm-portals.conf.
[preferred]
# GTK's portals for file choosers and the rest...
default=gtk
# ...and xdg-desktop-portal-wlr for screen sharing and screenshots.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
