<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The private D-Bus bus rustwm-session starts next to another graphical
     session: the standard session bus, except that services/ is searched
     first, so its service files replace the system's. A relative servicedir
     is relative to this file. -->
<busconfig>
  <servicedir>services</servicedir>
  <include>/usr/share/dbus-1/session.conf</include>
</busconfig>
