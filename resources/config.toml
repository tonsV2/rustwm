# rustwm settings. Copy to ~/.config/rustwm/config.toml and adjust.
# Every setting is optional; delete a line to use its default.
# Saving the file applies it, except the panel's command, position and mode and
# [autostart], which apply when rustwm restarts.

[output]
# Output scale. Without this line, rustwm guesses from the monitor's pixel
# density. Fractional values such as 1.25 or 1.5 stay sharp in apps that
# support fractional scaling (GTK 4, Qt 6, Firefox, Ghostty, ...).
scale = 1.25

[input]
# Pointer acceleration speed, from -1.0 (slowest) to 1.0 (fastest).
pointer_speed = 0.0
# Touchpad content follows the fingers when scrolling.
natural_scroll = false
tap_to_click = true

[keyboard]
# XKB keymap. Without these lines, rustwm uses the XKB_DEFAULT_* variables,
# or else the system keyboard set with `localectl set-x11-keymap`.
# layout = "us,dk"
# variant = ""
# model = "pc105"
# options = "grp:alt_shift_toggle,caps:escape"
# Milliseconds a key is held before it repeats, and repeats per second.
repeat_delay = 200
repeat_rate = 25

[shortcuts]
# What each shortcut runs, as a shell command (`sh -c`). An empty string ("") passes the key on to the focused application instead. The brightness and volume up and down keys repeat while held; the others do not.
brightness_up = "brightnessctl set +5%"
brightness_down = "brightnessctl set 5%-"
# rustwm-volume (next to rustwm-session) keeps the left/right balance;
# `wpctl set-volume` would set every channel to the same level.
volume_up = "rustwm-volume up 5"
volume_down = "rustwm-volume down 5"
volume_mute = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
mic_mute = "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
# Print saves the whole screen, Super+Shift+s a selected area.
screenshot = "mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/Screenshot-$(date +%Y-%m-%d-%H%M%S).png"
screenshot_area = 'area="$(slurp)" && mkdir -p ~/Pictures/Screenshots && grim -g "$area" ~/Pictures/Screenshots/Screenshot-$(date +%Y-%m-%d-%H%M%S).png'
# Super shortcuts. An empty string leaves the key to the focused app.
# rustwm-terminal (next to rustwm-session) picks xdg-terminal-exec, the first
# entry of ~/.config/xdg-terminals.list, or foot.
terminal = "rustwm-terminal"
file_manager = 'xdg-open "$HOME"'
browser = 'gtk-launch "$(xdg-settings get default-web-browser)"'
# `-f` returns once the screen is locked, `-c` sets the colour.
lock = "swaylock -f -c 000000"

[osd]
# After a brightness or volume key, show the new level near the bottom of
# the screen. Turn off if you run your own indicator, such as swayosd.
enabled = true

[panel]
# "top" or "bottom".
position = "top"
# "auto-hide" keeps the panel off screen until the pointer touches its edge; "always" keeps it shown and lays windows out beside it.
mode = "auto-hide"
# In auto-hide mode, how long the panel stays after the pointer leaves it, in milliseconds.
hide_delay_ms = 1000
# rustwm-panel runs Waybar with the config in resources/waybar (copy it to ~/.config/rustwm/waybar to change it). "" for no panel.
command = "rustwm-panel"

[autostart]
# Started once when rustwm is ready, each with `sh -c`, with the same environment as apps started from Fuzzel. They stop on their own when rustwm exits and its Wayland socket goes away. This one locks after 5 minutes without input, turns the monitor off after 10, and locks before suspend.
commands = [
    "swayidle -w timeout 300 'swaylock -f -c 000000' timeout 600 'wlopm --off \"*\"' resume 'wlopm --on \"*\"' before-sleep 'swaylock -f -c 000000'",
]
