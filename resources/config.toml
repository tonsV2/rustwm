# rustwm settings. Copy to ~/.config/rustwm/config.toml and adjust.
# Every setting is optional; delete a line to use its default.
# Changes take effect when rustwm restarts.

[output]
# Output scale. Without this line, rustwm guesses from the monitor's pixel
# density. Fractional values such as 1.25 or 1.5 stay sharp in apps that
# support fractional scaling (GTK 4, Qt 6, Firefox, Ghostty, ...).
scale = 1.25

[input]
# Pointer acceleration speed, from -1.0 (slowest) to 1.0 (fastest).
pointer_speed = 0.0
# Touchpad content follows the fingers when scrolling.
natural_scroll = false
tap_to_click = true

[keyboard]
# XKB keymap. Without these lines, rustwm uses the XKB_DEFAULT_* variables,
# or else the system keyboard set with `localectl set-x11-keymap`.
# layout = "us,dk"
# variant = ""
# model = "pc105"
# options = "grp:alt_shift_toggle,caps:escape"
# Milliseconds a key is held before it repeats, and repeats per second.
repeat_delay = 200
repeat_rate = 25

[commands]
# Shell commands for the brightness and volume keys, run with `sh -c`. An
# empty string ("") passes the key on to the focused application instead.
# The up and down keys repeat while held; the mute keys do not.
brightness_up = "brightnessctl set +5%"
brightness_down = "brightnessctl set 5%-"
volume_up = "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+"
volume_down = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
volume_mute = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
mic_mute = "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"

[osd]
# After a brightness or volume key, show the new level near the bottom of
# the screen. Turn off if you run your own indicator, such as swayosd.
enabled = true
